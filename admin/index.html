<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Product</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>ShopAdmin</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#" class="active">Products</a>
                <a href="#">Categories</a>
                <a href="#">Orders</a>
                <a href="#">Customers</a>
                <a href="#">Settings</a>
            </nav>

            <div class="admin-user">
                <div class="avatar">A</div>
                <div>
                    <strong>Admin</strong>
                    <small>Administrator</small>
                </div>
            </div>
        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">
                <div>
                    <h1>Add Product</h1>
                    <p>Create a new product for your store</p>
                </div>

                <button class="back-btn">← Products</button>
            </header>


            <!-- Product Form -->
            <section class="form-card">

                <div class="section-title">
                    <h2>Product Information</h2>
                    <p>Enter the details of your new product.</p>
                </div>

                <form id="productForm">

                    <div class="form-grid">

                        <!-- Product Name -->
                        <div class="form-group full">
                            <label>Product Name</label>
                            <input id="productName" type="text" placeholder="Enter product name" required>
                        </div>

                        <!-- Category -->
                        <div class="form-group">
                            <label>Category</label>
                            <select id="category" required>
                                <option value="">Select category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Fashion">Fashion</option>
                                <option value="Mobile">Mobile</option>
                                <option value="Home & Kitchen">Home & Kitchen</option>
                                <option value="Beauty">Beauty</option>
                            </select>
                        </div>

                        <!-- Brand -->
                        <div class="form-group">
                            <label>Brand</label>
                            <input id="brand" type="text" placeholder="Enter brand name" required>
                        </div>

                        <!-- Price -->
                        <div class="form-group">
                            <label>Price</label>
                            <input id="price" type="number" placeholder="₹ 0.00" required>
                        </div>

                        <!-- Discount Price -->
                        <div class="form-group">
                            <label>Discount Price</label>
                            <input id="discountPrice" type="number" placeholder="₹ 0.00">
                        </div>

                        <!-- Stock -->
                        <div class="form-group">
                            <label>Stock Quantity</label>
                            <input id="stock" type="number" placeholder="Enter quantity" required>
                        </div>

                        <!-- SKU -->
                        <div class="form-group">
                            <label>SKU</label>
                            <input id="sku" type="text" placeholder="e.g. IPH17-BLK-128" required>
                        </div>

                        <!-- Description -->
                        <div class="form-group full">
                            <label>Description</label>
                            <textarea id="description" rows="5" placeholder="Write product description..."></textarea>
                        </div>

                        <!-- Product Image -->
                        <div class="form-group full">
                            <label>Product Image</label>

                            <div class="upload-box">

                                <div class="upload-icon">↑</div>

                                <strong>Upload Product Image</strong>

                                <span>
                                    PNG, JPG or WEBP · Maximum 5MB
                                </span>

                                <input id="productImage" type="file" accept="image/*">

                            </div>
                        </div>

                        <!-- Status -->
                        <div class="form-group">
                            <label>Status</label>

                            <select id="status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>

                        <!-- Featured -->
                        <div class="form-group">
                            <label>Featured Product</label>

                            <select id="featured">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-actions">

                        <button type="button" class="cancel-btn" id="cancelProduct">
                            Cancel
                        </button>

                        <button type="submit" class="save-btn">
                            + Add Product
                        </button>

                    </div>

                </form>

            </section>

















            <!-- Product List -->
            <section class="products-section">

                <div class="products-header">

                    <div>
                        <h2>Products</h2>
                        <p id="productCount">Loading products...</p>
                    </div>

                    <input class="search" type="text" placeholder="Search products...">

                </div>

                <!-- Dynamic Product List -->
                <div class="product-table" id="productList">

                    <!-- Products will come from API -->

                </div>

            </section>














        </main>













    </div>

</body>

</html>
